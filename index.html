  <!-- 音效管理器 (Web Audio API) -->
  <script>
    const soundManager = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      play(type) {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
            osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
          } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.exponentialRampToValueAtTime(170, now + 0.25);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
            osc.start(now);
            osc.stop(now + 0.28);
          } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
            osc.start(now);
            osc.stop(now + 0.06);
          } else if (type === 'win') {
            // 慶祝旋律
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
              const noteOsc = this.ctx.createOscillator();
              const noteGain = this.ctx.createGain();
              noteOsc.type = 'triangle';
              noteOsc.frequency.value = freq;
              noteOsc.connect(noteGain);
              noteGain.connect(this.ctx.destination);
              noteGain.gain.setValueAtTime(0.15, now + i * 0.12);
              noteGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.2);
              noteOsc.start(now + i * 0.12);
              noteOsc.stop(now + i * 0.12 + 0.22);
            });
          }
        } catch(e) {
          console.warn("Audio unavailable", e);
        }
      }
    };
  </script>

              "兩者都沒有根，只有莖"
            ],
            ans: 1,
            exp: "蔥、蒜的根細細如鬍鬚，是「鬚根」；菠菜、小白菜則有一條較粗長的主根深入土壤，是「軸根」。"
          }
        ]
      }
    ];

    /* =========================================================
       3. 知識百寶箱圖卡資料庫
       ========================================================= */
    const flashcardsData = [
      {
        category: "root",
        title: "植物的根：軸根 vs 鬚根",
        icon: "ph-tree-structure",
        color: "emerald",
        summary: "根能吸收水分與養分，並緊緊抓住土壤固定植物身體。",
        bullets: [
          "🌱 軸根：有一條粗壯主根深入土壤，兩旁生細根（如小白菜、菠菜、莧菜、榕樹）。",
          "🌾 鬚根：沒有主根，全是一團細細如鬍鬚的根，分布於淺層土壤（如蔥、蒜、玉米、水稻）。",
          "💧 吸水實驗：將水瓶口以油土密封，幾天後水位下降，證實水是由根部吸收。"
        ]
      },
      {
        category: "stem",
        title: "植物的莖：三大形態",
        icon: "ph-arrows-split",
        color: "amber",
        summary: "莖負責支撐植物身體，並向上、向外伸展，爭取充足陽光。",
        bullets: [
          "🌳 木本莖：高大粗壯堅硬，能持續長粗長高，表面常有樹皮、裂紋或瘤刺（如樟樹、小葉欖仁、木棉）。",
          "🌿 草本莖：較細軟但能自行直立，向四面八方長出枝條（如長春花、大花咸豐草、昭和草）。",
          "🎋 藤本莖：柔軟無法直立，以卷鬚或莖本身纏繞攀爬在其他物體上（如牽牛花、絲瓜）。"
        ]
      },
      {
        category: "leaf",
        title: "葉的構造與葉序",
        icon: "ph-leaf",
        color: "green",
        summary: "葉片透過葉綠素接收陽光製造養分，是植物最重要的廚房。",
        bullets: [
          "🍃 葉片構造：葉形（心形、卵形）、葉緣（平滑、鋸齒狀）、葉脈（平行脈、網狀脈）。",
          "🔀 互生：每節長出1片葉子，交替向上（榕樹、朱槿）。",
          "👥 對生：每節相對長出2片葉子（桂花、福木）。",
          "🎡 輪生：每節長出3片或更多片葉子環繞（黑板樹）。",
          "☀️ 錯開生長：不互相遮蓋，使每片葉子都能曬到太陽。"
        ]
      },
      {
        category: "flower",
        title: "花與果實、種子",
        icon: "ph-flower",
        color: "rose",
        summary: "繁衍下一代的重要構造，吸引傳粉媒介並散播種子。",
        bullets: [
          "🌸 花的基本構造：花萼（保護花苞）、花瓣（鮮豔吸引昆蟲）、雄蕊（頂端花粉）、雌蕊（接受花粉）。",
          "🍎 果實保護與傳播：開花受精後發育成果實，果實包裹保護種子。",
          "🌬️ 風力傳播：果實輕薄或像氣囊（如臺灣欒樹、昭和草冠毛）。",
          "🐦 動物傳播：果肉香甜多汁引動物採食，種子隨糞便排出（龍眼、番石榴、木瓜）。"
        ]
      },
      {
        category: "life",
        title: "植物與我們的食衣住行育樂",
        icon: "ph-heart",
        color: "blue",
        summary: "人類食衣住行育樂處處依賴植物，也是野生動物的重要棲地。",
        bullets: [
          "🍚 食：米飯（稻米種子）、蔬菜（萵苣葉、高麗菜葉、菠菜根葉）、水果（芭樂果實）、玉米筍（嫩果實）。",
          "👕 衣：棉花植物纖維紡織製成棉T、亞麻布料。",
          "🏠 住與行：木材（莖）建造木屋、桌椅家具、達悟族拼板舟、登山木棧道。",
          "🎪 育與樂：植物園生態教學、景觀花鐘美化環境、薄荷九層塔增添生活風味。"
        ]
      }
    ];

    /* =========================================================
       4. 測驗模式 (Quiz) 狀態與控制邏輯
       ========================================================= */
    let currentQIndex = 0;
    const userAnswers = new Array(quizQuestions.length).fill(null);

    function initQuiz() {
      renderNavigator();
      showQuestion(currentQIndex);
    }

    function renderNavigator() {
      const navContainer = document.getElementById('question-navigator');
      navContainer.innerHTML = '';
      quizQuestions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.id = `nav-btn-${idx}`;
        btn.className = `w-8 h-8 rounded-xl font-bold text-xs shrink-0 transition-all flex items-center justify-center ${
          idx === currentQIndex 
            ? 'bg-brand-600 text-white ring-2 ring-brand-300' 
            : userAnswers[idx] !== null 
              ? (userAnswers[idx] === q.answer ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800')
              : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
        }`;
        btn.textContent = idx + 1;
        btn.onclick = () => {
          soundManager.play('click');
          currentQIndex = idx;
          showQuestion(idx);
        };
        navContainer.appendChild(btn);
      });
    }

    function showQuestion(idx) {
      const q = quizQuestions[idx];
      document.getElementById('quiz-progress-text').textContent = `第 ${idx + 1} / ${quizQuestions.length} 題`;
      document.getElementById('quiz-progress-bar').style.width = `${((idx + 1) / quizQuestions.length) * 100}%`;
      
      document.getElementById('q-category').innerHTML = `<i class="ph-bold ph-tag"></i> ${q.cat}`;
      document.getElementById('q-title').textContent = `${idx + 1}. ${q.q}`;

      const optionsContainer = document.getElementById('q-options');
      optionsContainer.innerHTML = '';

      const isAnswered = userAnswers[idx] !== null;

      q.options.forEach((opt, optIdx) => {
        const btn = document.createElement('button');
        const letter = ['A', 'B', 'C', 'D'][optIdx];
        
        let styleClasses = "w-full text-left p-4 rounded-2xl border-2 transition-all duration-200 flex items-center gap-3 font-semibold text-base ";
        
        if (!isAnswered) {
          styleClasses += "border-slate-100 bg-white hover:border-brand-300 hover:bg-brand-50/50 text-slate-700 shadow-sm active:scale-[0.99]";
        } else {
          if (optIdx === q.answer) {
            styleClasses += "border-emerald-500 bg-emerald-50 text-emerald-900 ring-2 ring-emerald-300";
          } else if (optIdx === userAnswers[idx]) {
            styleClasses += "border-rose-400 bg-rose-50 text-rose-900";
          } else {
            styleClasses += "border-slate-100 bg-slate-50/60 text-slate-400 opacity-60";
          }
        }

        btn.className = styleClasses;
        btn.innerHTML = `
          <span class="w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold shrink-0 ${
            isAnswered && optIdx === q.answer ? 'bg-emerald-600 text-white' : (isAnswered && optIdx === userAnswers[idx] ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600')
          }">${letter}</span>
          <span class="flex-1">${opt}</span>
          ${isAnswered && optIdx === q.answer ? '<i class="ph-bold ph-check-circle text-emerald-600 text-2xl ml-auto"></i>' : ''}
          ${isAnswered && optIdx === userAnswers[idx] && optIdx !== q.answer ? '<i class="ph-bold ph-x-circle text-rose-500 text-2xl ml-auto"></i>' : ''}
        `;

        if (!isAnswered) {
          btn.onclick = () => selectOption(idx, optIdx);
        } else {
          btn.disabled = true;
        }

        optionsContainer.appendChild(btn);
      });

      // 回饋框處理
      const feedbackBox = document.getElementById('q-feedback');
      if (isAnswered) {
        feedbackBox.classList.remove('hidden');
        const isCorrect = userAnswers[idx] === q.answer;
        if (isCorrect) {
          feedbackBox.className = "p-4 sm:p-5 rounded-2xl border border-emerald-200 bg-emerald-50/90 text-emerald-900 transition-all mb-6";
          document.getElementById('feedback-icon').className = "w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0";
          document.getElementById('feedback-icon').innerHTML = '<i class="ph-bold ph-check"></i>';
          document.getElementById('feedback-title').textContent = "回答正確！太棒了！🌟";
        } else {
          feedbackBox.className = "p-4 sm:p-5 rounded-2xl border border-rose-200 bg-rose-50/90 text-rose-900 transition-all mb-6";
          document.getElementById('feedback-icon').className = "w-8 h-8 rounded-xl bg-rose-500 text-white flex items-center justify-center shrink-0";
          document.getElementById('feedback-icon').innerHTML = '<i class="ph-bold ph-x"></i>';
          document.getElementById('feedback-title').textContent = `答錯囉！正確答案是 (${['A','B','C','D'][q.answer]})`;
        }
        document.getElementById('feedback-explanation').textContent = q.exp;
      } else {
        feedbackBox.classList.add('hidden');
      }

      // 控制前後按鈕
      document.getElementById('btn-prev').disabled = idx === 0;
      const nextBtn = document.getElementById('btn-next');
      if (idx === quizQuestions.length - 1) {
        nextBtn.innerHTML = `查看結算成績 <i class="ph-bold ph-flag-checkered"></i>`;
      } else {
        nextBtn.innerHTML = `下一題 <i class="ph-bold ph-caret-right"></i>`;
      }

      updateScoreDisplay();
      renderNavigator();
    }

    function selectOption(qIdx, optIdx) {
      if (userAnswers[qIdx] !== null) return;
      userAnswers[qIdx] = optIdx;

      const q = quizQuestions[qIdx];
      if (optIdx === q.answer) {
        soundManager.play('correct');
      } else {
        soundManager.play('wrong');
      }

      showQuestion(qIdx);

      // 若答滿30題，跳出完成提醒
      const answeredTotal = userAnswers.filter(a => a !== null).length;
      if (answeredTotal === quizQuestions.length) {
        setTimeout(showFinalResult, 700);
      }
    }

    function changeQuestion(delta) {
      soundManager.play('click');
      const nextIdx = currentQIndex + delta;
      if (nextIdx >= quizQuestions.length) {
        showFinalResult();
        return;
      }
      if (nextIdx >= 0 && nextIdx < quizQuestions.length) {
        currentQIndex = nextIdx;
        showQuestion(currentQIndex);
      }
    }

    function updateScoreDisplay() {
      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null && ans === quizQuestions[idx].answer) {
          score += 3.33; // 30 題滿分約 100
        }
      });
      document.getElementById('quiz-score').textContent = Math.round(score);
    }

    function showFinalResult() {
      soundManager.play('win');
      if (window.confetti) {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null && ans === quizQuestions[idx].answer) correctCount++;
      });
      const finalScoreVal = Math.round((correctCount / quizQuestions.length) * 100);

      document.getElementById('final-correct-count').textContent = `${correctCount} / ${quizQuestions.length}`;
      document.getElementById('final-score').textContent = `${finalScoreVal} 分`;

      let badge = "🌱 綠意小學徒";
      if (finalScoreVal >= 90) badge = "🏆 植物大博士（卓越超群）";
      else if (finalScoreVal >= 75) badge = "🌿 植物小達人（非常優秀）";
      else if (finalScoreVal >= 60) badge = "🍃 自然探險家（及格通過）";

      document.getElementById('final-badge').textContent = badge;
      document.getElementById('result-modal').classList.remove('hidden');
    }

    function closeResultModal() {
      soundManager.play('click');
      document.getElementById('result-modal').classList.add('hidden');
    }

    function restartQuiz() {
      soundManager.play('click');
      for (let i = 0; i < userAnswers.length; i++) userAnswers[i] = null;
      currentQIndex = 0;
      initQuiz();
    }

    /* =========================================================
       5. 素養題組 (Context Cases) 渲染與作答
       ========================================================= */
    let currentCaseIdx = 0;
    const caseUserAnswers = {}; // key: "caseIndex-questionIndex"

    function switchContextScenario(idx) {
      soundManager.play('click');
      currentCaseIdx = idx;
      // 更新 Tab 樣式
      document.querySelectorAll('.case-tab').forEach((tab, tIdx) => {
        if (tIdx === idx) {
          tab.className = "case-tab px-4 py-2.5 rounded-2xl font-bold text-sm bg-brand-600 text-white shadow-sm flex items-center gap-2";
        } else {
          tab.className = "case-tab px-4 py-2.5 rounded-2xl font-bold text-sm bg-white text-slate-600 hover:bg-brand-50 flex items-center gap-2";
        }
      });
      renderCaseContent();
    }

    function renderCaseContent() {
      const container = document.getElementById('case-content-area');
      const item = contextCases[currentCaseIdx];

      let questionsHtml = item.questions.map((subQ, qIdx) => {
        const ansKey = `${currentCaseIdx}-${qIdx}`;
        const userChoice = caseUserAnswers[ansKey];
        const isAnswered = userChoice !== undefined;

        let optionsMarkup = subQ.options.map((optText, optIdx) => {
          let btnClass = "w-full text-left p-3.5 rounded-xl border text-sm sm:text-base font-medium transition-all flex items-start gap-3 ";
          if (!isAnswered) {
            btnClass += "border-slate-200 bg-white hover:border-brand-400 hover:bg-emerald-50/50 text-slate-700";
          } else {
            if (optIdx === subQ.ans) {
              btnClass += "border-emerald-500 bg-emerald-50 text-emerald-950 font-bold ring-1 ring-emerald-300";
            } else if (optIdx === userChoice) {
              btnClass += "border-rose-400 bg-rose-50 text-rose-900";
            } else {
              btnClass += "border-slate-100 bg-slate-50 text-slate-400 opacity-60";
            }
          }

          return `
            <button 
              ${isAnswered ? 'disabled' : ''} 
              onclick="answerCaseQuestion(${currentCaseIdx}, ${qIdx}, ${optIdx})" 
              class="${btnClass}">
              <span class="w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 ${
                isAnswered && optIdx === subQ.ans ? 'bg-emerald-600 text-white' : (isAnswered && optIdx === userChoice ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600')
              }">${['A','B','C','D'][optIdx]}</span>
              <span class="flex-1">${optText}</span>
            </button>
          `;
        }).join('');

        let explanationMarkup = isAnswered ? `
          <div class="mt-3 p-3.5 rounded-xl text-xs sm:text-sm ${userChoice === subQ.ans ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-rose-50 text-rose-900 border border-rose-200'}">
            <div class="font-bold mb-0.5">${userChoice === subQ.ans ? '✅ 答對了！' : '❌ 答錯了喔！'}</div>
            <div>${subQ.exp}</div>
          </div>
        ` : '';

        return `
          <div class="bg-white/80 rounded-2xl p-5 border border-emerald-100/80 shadow-sm space-y-3">
            <h4 class="font-bold text-slate-800 text-base flex items-start gap-2">
              <span class="px-2 py-0.5 bg-brand-100 text-brand-800 rounded-md text-xs font-black">第 ${qIdx + 1} 小題</span>
              <span>${subQ.q}</span>
            </h4>
            <div class="space-y-2">
              ${optionsMarkup}
            </div>
            ${explanationMarkup}
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h3 class="text-xl sm:text-2xl font-black text-emerald-950 flex items-center gap-2">
              <i class="ph-fill ph-plant text-brand-600"></i> ${item.title}
            </h3>
            <span class="text-xs px-3 py-1 bg-amber-100 text-amber-800 font-bold rounded-full">${item.badge}</span>
          </div>

          <!-- 情境短文故事 -->
          <div class="bg-gradient-to-r from-emerald-50/80 to-teal-50/80 border-l-4 border-brand-500 p-4 sm:p-5 rounded-r-2xl space-y-2 text-slate-700 leading-relaxed text-sm sm:text-base">
            <div class="font-bold text-emerald-900 flex items-center gap-1.5 text-sm">
              <i class="ph-bold ph-book-open"></i> 情境閱讀與觀察資料
            </div>
            <div class="whitespace-pre-line">${item.story}</div>
          </div>

          <!-- 小題挑戰列表 -->
          <div class="space-y-4 pt-2">
            ${questionsHtml}
          </div>
        </div>
      `;
    }

    function answerCaseQuestion(caseIdx, qIdx, optIdx) {
      const key = `${caseIdx}-${qIdx}`;
      if (caseUserAnswers[key] !== undefined) return;
      caseUserAnswers[key] = optIdx;

      const subQ = contextCases[caseIdx].questions[qIdx];
      if (optIdx === subQ.ans) {
        soundManager.play('correct');
      } else {
        soundManager.play('wrong');
      }

      renderCaseContent();
    }

    /* =========================================================
       6. 知識百寶箱圖卡複習
       ========================================================= */
    function filterFlashcards(cat) {
      soundManager.play('click');
      document.querySelectorAll('.flashcard-filter').forEach(btn => {
        btn.className = "flashcard-filter px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-600 hover:bg-emerald-50";
      });
      event.target.className = "flashcard-filter px-4 py-2 rounded-xl text-sm font-bold bg-brand-600 text-white";

      renderFlashcards(cat);
    }

    function renderFlashcards(filter = 'all') {
      const container = document.getElementById('flashcards-grid');
      container.innerHTML = '';

      const filtered = filter === 'all' 
        ? flashcardsData 
        : flashcardsData.filter(c => c.category === filter);

      filtered.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = "glass-card rounded-2xl p-5 border border-emerald-100 flex flex-col justify-between custom-bounce transition-all duration-300";
        cardEl.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-brand-100 text-brand-700 flex items-center justify-center text-xl shrink-0">
                <i class="ph-bold ${card.icon}"></i>
              </div>
              <h3 class="font-bold text-lg text-slate-800 leading-snug">${card.title}</h3>
            </div>
            <p class="text-xs text-brand-800 bg-brand-50/70 p-2.5 rounded-xl font-medium border border-brand-100">
              ${card.summary}
            </p>
            <ul class="text-sm text-slate-600 space-y-2 pt-1">
              ${card.bullets.map(b => `<li class="flex items-start gap-1.5 leading-relaxed text-xs sm:text-sm"><span>${b}</span></li>`).join('')}
            </ul>
          </div>
          <div class="pt-4 mt-3 border-t border-slate-100 flex justify-end">
            <span class="text-xs text-brand-600 font-bold flex items-center gap-1">
              重點複習 <i class="ph-bold ph-check-circle"></i>
            </span>
          </div>
        `;
        container.appendChild(cardEl);
      });
    }

    /* =========================================================
       7. 頂部模式切換處理
       ========================================================= */
    function switchTab(mode) {
      soundManager.play('click');
      const tabs = ['quiz', 'context', 'cards'];
      tabs.forEach(t => {
        const sec = document.getElementById(`${t}-section`);
        const navBtn = document.getElementById(`nav-${t}`);
        if (t === mode) {
          sec.classList.remove('hidden');
          navBtn.className = "px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-1.5 transition-all bg-brand-600 text-white shadow-sm";
        } else {
          sec.classList.add('hidden');
          navBtn.className = "px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-1.5 transition-all text-slate-600 hover:bg-emerald-50";
        }
      });

      if (mode === 'context') {
        renderCaseContent();
      } else if (mode === 'cards') {
        renderFlashcards('all');
      }
    }

    // 初始化啟動
    window.addEventListener('DOMContentLoaded', () => {
      initQuiz();
    });
  </script>
</body>
</html>
